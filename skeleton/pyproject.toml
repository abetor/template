[project]
name = "{{tool_name}}"
version = "0.1.0"
description = "TODO: one sentence describing this tool"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
{{tool_name}} = "{{pkg}}.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["{{pkg}}*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
